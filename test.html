<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#f3f2ee">
  <title>Test · dgt-eando</title>

  <!-- Marca el modo repaso antes del primer pintado para evitar parpadeos del layout de test -->
  <script>
    const modo = new URLSearchParams(location.search).get('modo');
    if (modo === 'repaso' || modo === 'falladas') {
      document.documentElement.classList.add(`modo-${modo}`);
    }
  </script>

  <!-- Hojas de estilo · orden obligatorio: 1º variables.css · 2º componentes.css · 3º CSS de la página -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="css/variables.css?v=5">
  <link rel="stylesheet" href="css/componentes.css?v=8">
  <link rel="stylesheet" href="css/test.css?v=13">
  <!-- Fuente (ya no hay @import dentro de los CSS) -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&display=swap">
</head>
<body>

  <main class="test-column">
    <div class="test-title-row">
      <h1 class="test-title">test <span class="num" id="testNum">nº …</span></h1>
      <span class="badge badge--contorno" id="lblModo">Modo examen</span>
    </div>

    <!-- Avisos (falta id, JSON no encontrado, etc.) -->
    <div id="avisoTest" role="alert" style="display:none;"></div>

    <!-- Modos Anki (repaso/falladas): el motor pinta aquí la barra superior y las tarjetas -->
    <div id="repasoContainer" class="repaso-app" style="display:none;"></div>

    <form id="formTest" onsubmit="return false;">
      <div id="preguntasContainer"></div>

      <div class="corregir-box">
        <button type="button" class="btn btn--primario btn--lg" id="btnCorregir" onclick="corregirTest()">Corregir el test</button>
        <a href="index.html" class="btn btn--secundario btn--lg" id="btnVolver">Volver a la lista</a>
      </div>

      <div class="reportar-error-box">
        <button type="button" class="btn btn--suave btn--xs btn-reportar-error" id="btnAnadirPregunta" hidden>
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 21V4"/><path d="M5 4h11l-2 4 2 4H5"/></svg>
          REPORTAR ERROR
        </button>
      </div>

      <div class="resultado-panel" id="resultadoPanel"></div>
      <div id="estadoGuardado" aria-live="polite"></div>
    </form>
  </main>

  <!-- Modal para corregir una pregunta o añadir una que falte al final del test -->
  <div class="modal-overlay modal-correccion-overlay" id="modalCorreccion" aria-hidden="true">
    <form class="modal-contenido modal-correccion" id="formCorreccion" role="dialog" aria-modal="true" aria-labelledby="corrTitulo" novalidate>
      <div class="modal-header">
        <h2 class="modal-titulo" id="corrTitulo">Corregir pregunta</h2>
        <button type="button" class="modal-cerrar" id="corrCerrar" aria-label="Cerrar">×</button>
      </div>
      <p class="correccion-nueva-aviso" id="corrPreguntaNuevaAviso" hidden>La nueva pregunta se añadirá al final del cuestionario, sin cambiar el orden de las preguntas existentes.</p>

      <div class="correccion-campo">
        <label class="campo-etiqueta" for="corrEnunciado">Enunciado</label>
        <textarea class="textarea-texto" id="corrEnunciado" rows="3"></textarea>
      </div>

      <fieldset class="correccion-campo">
        <legend class="campo-etiqueta">Opciones · marca la correcta</legend>
        <div class="correccion-opcion">
          <input type="radio" class="correccion-radio" name="corrCorrecta" id="corrRadio0" value="0" aria-label="Opción a correcta">
          <span class="correccion-letra" aria-hidden="true">a)</span>
          <input type="text" class="input-texto" id="corrOpcion0" aria-label="Opción a">
        </div>
        <div class="correccion-opcion">
          <input type="radio" class="correccion-radio" name="corrCorrecta" id="corrRadio1" value="1" aria-label="Opción b correcta">
          <span class="correccion-letra" aria-hidden="true">b)</span>
          <input type="text" class="input-texto" id="corrOpcion1" aria-label="Opción b">
        </div>
        <div class="correccion-opcion">
          <input type="radio" class="correccion-radio" name="corrCorrecta" id="corrRadio2" value="2" aria-label="Opción c correcta">
          <span class="correccion-letra" aria-hidden="true">c)</span>
          <input type="text" class="input-texto" id="corrOpcion2" aria-label="Opción c (opcional)">
        </div>
        <span class="correccion-ayuda">La opción c es opcional: déjala vacía si la pregunta solo tiene dos.</span>
      </fieldset>

      <div class="correccion-campo correccion-imagen-campo" id="corrImagenCampo" hidden>
        <span class="campo-etiqueta">Imagen <span class="opcional">(opcional)</span></span>
        <label class="correccion-imagen-drop" id="corrImagenDrop" for="corrImagenArchivo">
          <input type="file" id="corrImagenArchivo" accept="image/jpeg,image/png,image/webp">
          <span>Arrastra una imagen aquí o <strong>selecciónala</strong> · JPG, PNG o WebP · máximo 5 MB</span>
        </label>
        <div class="correccion-imagen-preview" id="corrImagenPreview" hidden>
          <img id="corrImagenPreviewImg" alt="Vista previa de la imagen">
          <span id="corrImagenNombre"></span>
        </div>
      </div>

      <div class="correccion-campo">
        <label class="campo-etiqueta" for="corrExplicacion">Explicación <span class="opcional">(opcional)</span></label>
        <textarea class="textarea-texto" id="corrExplicacion" rows="2"></textarea>
      </div>

      <div class="correccion-campo">
        <label class="campo-etiqueta" for="corrNota">Nota / motivo <span class="opcional">(opcional)</span></label>
        <input type="text" class="input-texto" id="corrNota" placeholder="Ej.: el OCR cortó el enunciado">
      </div>

      <p class="correccion-error" id="corrError" role="alert" hidden></p>

      <div class="correccion-acciones">
        <button type="button" class="btn-cancelar-anki" id="corrCancelar">Cancelar</button>
        <button type="submit" class="btn-guardar-anki" id="corrGuardar">Guardar corrección</button>
      </div>
    </form>
  </div>

  <noscript>Este test necesita JavaScript. <a href="index.html">Volver a la lista</a></noscript>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/categorias.js?v=1"></script>
  <script src="js/storage.js?v=16"></script>
  <script src="js/test_engine.js?v=20"></script>
</body>
</html>
